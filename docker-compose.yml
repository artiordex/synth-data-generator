services:
  # 1. 통합 엔터프라이즈 합성데이터 플랫폼 (웹 UI + REST API + HWPX 생성기)
  synth-data-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: synth-data-generator:latest
    container_name: synth-data-generator
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=sqlite:///storage/local/app.db
      - STORAGE_DIR=/app/storage
    volumes:
      # 로컬 PC의 storage 디렉토리와 컨테이너 바인딩 (생성된 HWPX 및 SQLite DB 영구 보존)
      - ./storage:/app/storage
    restart: unless-stopped

  # 2. Cloudflare Tunnel (외부 인터넷 접속용 무료 보안 터널)
  # 실행 명령: docker compose --profile tunnel up -d
  # 외부 주소 확인: docker compose logs -f tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: synth-data-generator-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://synth-data-generator:8000
    depends_on:
      - synth-data-generator
    profiles:
      - tunnel
