services:
  # 1. 통합 엔터프라이즈 합성데이터 플랫폼 (웹 UI + REST API + HWPX 생성기)
  synth-data-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: synth-data-generator:latest
    container_name: synth-data-generator
    env_file:
      - .env
    ports:
      # 맥북/사내 PC에서 기존 API 포트로 직접 접근할 때 사용한다.
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=sqlite:///storage/local/app.db
      - STORAGE_DIR=/app/storage
    volumes:
      # 로컬 PC의 storage 디렉토리와 컨테이너 바인딩 (생성된 HWPX 및 SQLite DB 영구 보존)
      - ./storage:/app/storage
    restart: unless-stopped

  # 사내망 진입점: 웹 UI와 API를 통합 서버로 전달한다.
  nginx:
    image: nginx:stable-alpine
    container_name: synth-data-nginx
    ports:
      # 브라우저 접속용 기본 진입점. 맥북에서는 http://Windows-PC-IP 로 접근한다.
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      synth-data-generator:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Cloudflare Tunnel (외부 인터넷 접속용 무료 보안 터널)
  # 실행 명령: docker compose --profile tunnel up -d
  # 외부 주소 확인: docker compose logs -f tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: synth-data-generator-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://synth-data-generator:8000
    depends_on:
      - synth-data-generator
    profiles:
      - tunnel
