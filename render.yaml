services:
  - type: web
    name: synth-data-generator
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
