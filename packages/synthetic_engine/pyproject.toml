[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthetic_engine*", "docengine*"]

[project]
name = "synthetic-engine"
version = "2.1.0"
description = "Core AI Synthetic Data Generation, Differential Privacy, Anonymeter & HWP Exporter Engine"
readme = "합성엔진안내.md"
requires-python = ">=3.10"
dependencies = [
    "ocr-pipeline>=0.1.0",
    "markdown>=3.6",
    "lxml>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "soupsieve>=2.5",
    "tinycss2>=1.2",
    "pdfplumber>=0.11",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.2",
    "faker>=25.0.0",
    "sdv>=1.13.0",
    "torch>=2.0.0",
    "anonymeter>=1.1.0",
    "olefile>=0.47",
    "python-hwpx==6.3.0",
    "pymupdf>=1.24.0",
    "reportlab>=4.1.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python-headless>=4.9.0",
    "easyocr>=1.7.0",
    "scipy>=1.12.0",
    "python-pptx>=1.0.0",
    "pillow-heif>=1.7.0",
    "piexif>=1.1.3",
    "kiwipiepy>=0.20.0",
    "statsmodels>=0.14.0",
    "duckdb>=1.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rendering = [
    "playwright>=1.62.0",
    "weasyprint>=69.0",
]
windows = [
    "pywin32>=310; sys_platform == 'win32'",
]

[tool.setuptools.package-data]
synthetic_engine = ["common/domain_catalog.json", "rules/profiles.yaml"]

[tool.uv.sources]
ocr-pipeline = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
