[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthetic_engine*"]

[project]
name = "synthetic-engine"
version = "2.1.0"
description = "Core AI Synthetic Data Generation, Differential Privacy, Anonymeter & HWP Exporter Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "faker>=25.0.0",
    "sdv>=1.13.0",
    "torch>=2.0.0",
    "anonymeter>=1.1.0",
    "olefile>=0.47",
    "python-hwpx==6.3.0",
    "pymupdf>=1.24.0",
    "reportlab>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
