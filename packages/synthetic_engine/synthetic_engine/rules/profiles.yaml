        rule_type: unique_record_match_block
        columns: [자녀수, 출산여부, 연령대, 주택유형]
        action: drop
        params: {}
        description: "원본 유일 레코드와 완전일치하는 합성 레코드 제거"
    notes: "출산비율 원본(19%) 보존, 소요기간 범주 오류 방지, 설명변수-출산여부 관계 보존"
