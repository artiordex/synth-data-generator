          condition_values: [Y, y, "1", 유, 있음, 해당]
          target_column: 장애인가구
          target_value: {by_dtype: {numeric: 1, string: Y}}
        description: "장애인가구 ↔ 장애여부 간 모순 제거 (장애여부 있음이면 장애인가구 해당)"
      - name: 주거복지_원본_유일레코드_복제방지
        rule_type: unique_record_match_block
        columns: [장애여부, 질병여부, 연령대, 성별]
        action: drop
        params: {}
        description: "원본 유일 레코드와 일치하는 합성 레코드 엄격 제거"
    notes: "원본 유의 범주 간 연관 26쌍 소실 방지 및 민감정보 안전성 검증"

  - dataset_name: 주택유형별 임대료 체납현황
    dataset_id: rental_arrears
    aliases: [체납현황, 임대료체납, 임대료 체납, 주택유형별 임대료 체납현황, 공공임대체납]
    quasi_identifiers: [주택유형, 자치구, 연령대]
    sensitive_columns: [체납금액, 연체료, 연체료합계, 체납월수, 연체횟수]
    numerical_columns: [체납금액, 연체료, 연체료합계, 체납월수, 연체횟수]
    categorical_columns: [주택유형, 자치구, 연령대]
    date_columns: [입주일자]
    derived_columns: [연체료합계]
    rules:
      - name: 체납현황_연체료합계_산식_재계산
        rule_type: calculated_field
        columns: [연체료합계, 연체료]
        action: recalculate
        params: {target_column: 연체료합계, calculation: sum_arrears, source_columns: [연체료]}
        description: "연체료 합계는 정의된 상세 연체료 산식과 일치하도록 재계산"
      - name: 체납현황_최소값_과집중_방지
        rule_type: extreme_value
        columns: [연체료합계]
        action: repair_conditional
        params: {prevent_min_spike: true, spike_value: 10, spike_threshold: 0.30, scale: 500, offset: 10, round_digits: -1}
        description: "최소값 10원에 값이 과도하게 집중(67%)되지 않도록 스무딩/재분포"
    notes: "연체횟수 ↔ 연체료합계 상관관계(0.91) 보존 및 청년안심주택 연령/입주 모순 제거"

