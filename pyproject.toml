[project]
name = "synth-data-studio-workspace"
version = "2.1.0"
description = "AI Synthetic Data Studio Monorepo Workspace"
readme = "프로젝트안내.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "easyocr>=1.7.2",
    "kiwipiepy>=0.23.2",
    "opencv-python-headless>=4.11.0.86",
    "piexif>=1.1.3",
    "pillow-heif>=1.7.0",
    "python-pptx>=1.0.2",
    "rapidfuzz>=3.14.5",
    "rapidocr-onnxruntime>=1.4.4",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/synthetic_engine",
]

[tool.uv.sources]
synthetic-engine = { workspace = true }
synthetic-api = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "packages/synthetic_engine/tests"]
python_files = ["test_*.py"]
