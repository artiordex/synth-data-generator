[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-api"
version = "2.1.0"
description = "Enterprise Synthetic Data Generator Backend API"
readme = "백엔드API안내.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.26.0",
    "pywin32>=310; sys_platform == 'win32'",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
    "python-docx>=1.2.0",
    "pypdf>=6.17.0",
    "tabulate>=0.10.0",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "lxml>=5.0.0",
    "markdown>=3.10.0",
    "mammoth>=1.12.0",
    "pyhwp>=0.1b15",
    "pillow>=10.0.0",
    "synthetic-engine>=2.1.0",
    "playwright>=1.62.0",
    "weasyprint>=69.0",
    "pdfplumber>=0.11.10",
    "xhtml2pdf>=0.2.17",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python-headless>=4.9.0",
    "easyocr>=1.7.0",
    "scipy>=1.12.0",
    "python-pptx>=1.0.0",
    "pillow-heif>=1.7.0",
    "piexif>=1.1.3",
    "kiwipiepy>=0.20.0",
    "statsmodels>=0.14.0",
    "duckdb>=1.0.0",
    "rapidfuzz>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthetic_api*"]

[tool.setuptools.package-data]
synthetic_api = ["data/*.json"]

[tool.uv.sources]
synthetic-engine = { workspace = true }
